<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Головний екран «Мій сад» — компоненти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0A0E08; font-family: 'Manrope', sans-serif; }
  @keyframes hm-sway { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
  @keyframes hm-pulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
</style>
</head>
<body>
<div id="root"></div>

<!-- ============================================================
  ГОЛОВНИЙ ЕКРАН «МІЙ САД» — розбито на компоненти

  Розкладка верхньої панелі (за рішенням):
  ЛІВОРУЧ  — іконка «Завдання тижня» (бейдж = к-сть невиконаних)
  ПРАВОРУЧ — баланси (монети, кристали) + аватар персонажа (вхід у профіль)

  Дерево:
  HomeScreen
   ├─ TopBar
   │   ├─ TasksButton            вхід у Завдання тижня (ліворуч, з бейджем)
   │   ├─ CurrencyPill ×2        монети + кристали (праворуч)
   │   └─ AvatarButton           вхід у профіль (золота рамка престижу)
   ├─ GardenHeading             «Моя грядка / Мій сад» + лічильники
   ├─ PlantGrid                  3×2 сітка горщиків
   │   └─ PlantTile ×N          стан: ready | growing | disease | empty
   └─ BottomNav                  Сад · Лабораторія · Дендрарій · Крамниця
============================================================= -->

<script type="text/plain" id="app-src">
const { useState } = React;

/* ── ТОКЕНИ ──────────────────────────────────────────── */
const C = {
  green:'#A7CE73', greenBright:'#B5E67A', gold:'#E4C77E',
  text:'#F2ECDF', mut:'#8C9683',
  glass:'rgba(255,255,255,.055)', border:'rgba(255,255,255,.1)',
  head:"'Cormorant Garamond',serif", disp:"'Newsreader',serif",
  prestige:'conic-gradient(from 210deg,#EDD592,#8C6A2E,#F6E4A6,#C9A65A,#EDD592)',
};

/* ── ДАНІ (замінити на PlayerData / стан саду) ───────── */
const PLAYER = { coins:'1 240', gems:36, pendingTasks:2 };
// стан плитки: 'ready' | 'growing' | 'disease' | 'empty'
const PLANTS = [
  { id:1, name:'Троянда',  state:'ready',   pct:100 },
  { id:2, name:'Лаванда',  state:'growing', pct:62, timer:'1 год' },
  { id:3, name:'Монстера', state:'growing', pct:34, timer:'4 год' },
  { id:4, name:'Фікус',    state:'disease', pct:48 },
  { id:5, name:'Сукулент', state:'ready',   pct:100 },
  { id:6, state:'empty' },
];
const NAV = [
  { id:'garden', label:'Сад',        active:true },
  { id:'lab',    label:'Лабораторія' },
  { id:'dex',    label:'Дендрарій' },
  { id:'shop',   label:'Крамниця' },
];

/* ── SVG: рослина в горщику (спільна ілюстрація) ─────── */
function PlantArt({ w=88, sway=5, style }) {
  return (
    <svg viewBox="0 0 120 116" style={{ width:w, ...style }}>
      <defs>
        <linearGradient id="hmLeafA" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stopColor="#8FB861"/><stop offset="0.55" stopColor="#5E8442"/><stop offset="1" stopColor="#3C5A2C"/></linearGradient>
        <linearGradient id="hmLeafB" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stopColor="#6E9A4E"/><stop offset="0.6" stopColor="#456530"/><stop offset="1" stopColor="#2C4420"/></linearGradient>
        <linearGradient id="hmPot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#A9694A"/><stop offset="1" stopColor="#6E4230"/></linearGradient>
        <radialGradient id="hmSoil" cx="0.5" cy="0.35" r="0.7"><stop offset="0" stopColor="#4A3524"/><stop offset="1" stopColor="#2A1D12"/></radialGradient>
      </defs>
      <g style={{ transformOrigin:'60px 106px', animation:`hm-sway ${sway}s ease-in-out infinite` }}>
        <ellipse cx="60" cy="106" rx="26" ry="4.5" fill="#000" opacity="0.35"/>
        <path d="M42 78 H78 L73 102 Q72 106 67 106 H53 Q48 106 47 102 Z" fill="url(#hmPot)" stroke="#5A3623" strokeWidth="1.3"/>
        <rect x="39" y="73" width="42" height="8" rx="3" fill="#B5785A" stroke="#5A3623" strokeWidth="1.3"/>
        <ellipse cx="60" cy="77" rx="18" ry="3.4" fill="url(#hmSoil)"/>
        <g>
          <PArtLeaf href="#hmLeafB" t="translate(60,72) rotate(-40) scale(0.62)"/>
          <PArtLeaf href="#hmLeafB" t="translate(60,68) rotate(38) scale(0.66)"/>
          <PArtLeaf href="#hmLeafA" t="translate(60,60) rotate(-22) scale(0.7)"/>
          <PArtLeaf href="#hmLeafA" t="translate(60,58) rotate(16) scale(0.64)"/>
          <PArtLeaf href="#hmLeafA" t="translate(60,54) rotate(-4) scale(0.56)"/>
        </g>
      </g>
    </svg>
  );
}
function PArtLeaf({ href, t }) {
  const fill = href === '#hmLeafA' ? 'url(#hmLeafA)' : 'url(#hmLeafB)';
  const stroke = href === '#hmLeafA' ? '#2E4A22' : '#233A19';
  const vein = href === '#hmLeafA' ? '#B9D69A' : '#9BC07C';
  return (
    <g transform={t}>
      <path d="M0 0 C -9 -4 -13 -18 -10 -32 C -8 -42 -3 -48 0 -54 C 3 -48 8 -42 10 -32 C 13 -18 9 -4 0 0 Z" fill={fill} stroke={stroke} strokeWidth="1.1"/>
      <path d="M0 -3 L0 -50" stroke={vein} strokeWidth="1.3" opacity="0.48" strokeLinecap="round"/>
    </g>
  );
}

/* ── ВЕРХНЯ ПАНЕЛЬ ─────────────────────────────────────── */
function TasksButton({ count }) {
  return (
    <button style={{ position:'relative', width:42, height:42, borderRadius:14, background:'rgba(228,199,126,.14)', border:'1px solid rgba(228,199,126,.34)', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flex:'none' }}>
      <svg viewBox="0 0 24 24" style={{ width:22, height:22 }}><path d="M12 3 L14.6 9 L21 9.5 L16 13.8 L17.6 20 L12 16.5 L6.4 20 L8 13.8 L3 9.5 L9.4 9 Z" fill={C.gold}/></svg>
      {count > 0 && <span style={{ position:'absolute', top:-5, right:-5, minWidth:19, height:19, padding:'0 5px', borderRadius:999, background:'linear-gradient(180deg,#F0A98C,#D9744F)', border:'2px solid #12180D', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:800, color:'#fff' }}>{count}</span>}
    </button>
  );
}
function CurrencyPill({ icon, value }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:7, background:C.glass, border:`1px solid ${C.border}`, borderRadius:999, padding:'6px 13px 6px 7px' }}>
      {icon}
      <span style={{ fontWeight:600, fontSize:14, color:'#EBE4D6', letterSpacing:.3 }}>{value}</span>
    </div>
  );
}
function AvatarButton() {
  return (
    <button style={{ position:'relative', width:42, height:42, borderRadius:'50%', padding:2.5, border:'none', cursor:'pointer', background:C.prestige, boxShadow:'0 3px 10px -2px rgba(228,199,126,.55)', flex:'none' }}>
      <span style={{ display:'flex', width:'100%', height:'100%', borderRadius:'50%', background:'radial-gradient(circle at 50% 40%,#2E4022,#16200F)', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
        <svg viewBox="0 0 40 40" style={{ width:26 }}><ellipse cx="20" cy="22" rx="12" ry="11" fill={C.green}/><path d="M20 12 Q15 5 11 7 Q13 13 20 13 Q27 13 29 7 Q25 5 20 12 Z" fill="#8FB861"/><circle cx="16" cy="22" r="1.8" fill="#2E4022"/><circle cx="24" cy="22" r="1.8" fill="#2E4022"/></svg>
      </span>
      <span style={{ position:'absolute', top:-1, right:-1, width:12, height:12, borderRadius:'50%', background:C.greenBright, border:'2px solid #12180D' }}/>
    </button>
  );
}
function TopBar({ player }) {
  return (
    <div style={{ position:'absolute', top:0, left:0, right:0, padding:'14px 20px 0', zIndex:5 }}>
      <div style={{ display:'flex', justifyContent:'space-between', fontSize:12, fontWeight:600, color:'#A9B2A0', padding:'2px 2px 12px' }}><span>9:41</span><span style={{ letterSpacing:2 }}>▪ ▪ ▪ ▊</span></div>
      <div style={{ display:'flex', alignItems:'center', gap:9 }}>
        <TasksButton count={player.pendingTasks}/>
        <div style={{ flex:1 }}/>
        <CurrencyPill value={player.coins} icon={<svg viewBox="0 0 24 24" style={{ width:18, height:18 }}><circle cx="12" cy="12" r="9" fill={C.gold}/><circle cx="12" cy="12" r="9" fill="none" stroke="#C9A65A" strokeWidth="1.6"/><circle cx="12" cy="12" r="5" fill="none" stroke="#B8934A" strokeWidth="1.6"/></svg>}/>
        <CurrencyPill value={player.gems} icon={<svg viewBox="0 0 24 24" style={{ width:18, height:18 }}><path d="M12 2 L20 10 L12 22 L4 10 Z" fill="#8FD0E6"/><path d="M4 10 H20 M12 2 V22" stroke="#4E9AC0" strokeWidth="1.3" opacity=".6"/></svg>}/>
        <AvatarButton/>
      </div>
    </div>
  );
}

/* ── ЗАГОЛОВОК ГРЯДКИ ──────────────────────────────────── */
function GardenHeading({ growing, ready }) {
  return (
    <div style={{ marginTop:18 }}>
      <div style={{ fontSize:12, color:C.mut, letterSpacing:1.5, textTransform:'uppercase', marginBottom:2 }}>Моя грядка</div>
      <h2 style={{ fontFamily:C.head, fontWeight:600, fontSize:36, color:C.text, margin:0, lineHeight:1 }}>Мій сад</h2>
      <div style={{ display:'flex', alignItems:'center', gap:10, marginTop:8, fontSize:13, color:C.mut }}>
        <span><b style={{ color:C.green, fontWeight:700 }}>{growing}</b> ростуть</span>
        <span style={{ width:3, height:3, borderRadius:'50%', background:'rgba(255,255,255,.25)' }}/>
        <span><b style={{ color:C.gold, fontWeight:700 }}>{ready}</b> готові</span>
      </div>
    </div>
  );
}

/* ── ПЛИТКА ГОРЩИКА ────────────────────────────────────── */
const TILE = {
  ready:   { bg:'linear-gradient(165deg,rgba(167,206,115,.16),rgba(255,255,255,.03))', border:'rgba(167,206,115,.3)', bar:'linear-gradient(90deg,#8FBF5A,#B5E67A)' },
  growing: { bg:'linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.02))', border:'rgba(255,255,255,.1)', bar:'linear-gradient(90deg,#7FA85C,#A7CE73)' },
  disease: { bg:'linear-gradient(165deg,rgba(214,150,86,.14),rgba(255,255,255,.02))', border:'rgba(214,150,86,.32)', bar:'linear-gradient(90deg,#C77E4A,#E7A66B)' },
};
function StateBadge({ state, timer }) {
  if (state === 'ready') return (
    <div style={{ position:'absolute', top:10, left:10, display:'flex', alignItems:'center', gap:5, background:'rgba(167,206,115,.22)', border:'1px solid rgba(167,206,115,.4)', borderRadius:999, padding:'2px 9px 2px 7px' }}>
      <span style={{ width:6, height:6, borderRadius:'50%', background:C.greenBright, boxShadow:'0 0 8px #A7CE73', animation:'hm-pulse 2s ease-in-out infinite' }}/>
      <span style={{ fontSize:10, fontWeight:700, color:'#CDEBA0' }}>Готово</span>
    </div>
  );
  if (state === 'disease') return (
    <div style={{ position:'absolute', top:10, left:10, display:'flex', alignItems:'center', gap:5, background:'rgba(214,120,86,.2)', border:'1px solid rgba(214,120,86,.4)', borderRadius:999, padding:'2px 9px 2px 7px' }}>
      <svg viewBox="0 0 24 24" style={{ width:11, height:11 }}><path d="M12 4 L21 19 H3 Z" fill="none" stroke="#E7A66B" strokeWidth="2.2" strokeLinejoin="round"/><path d="M12 10 V14" stroke="#E7A66B" strokeWidth="2.2" strokeLinecap="round"/><circle cx="12" cy="16.5" r="1.1" fill="#E7A66B"/></svg>
      <span style={{ fontSize:10, fontWeight:700, color:'#EDB98A' }}>Хвороба</span>
    </div>
  );
  return (
    <div style={{ position:'absolute', top:10, left:10, display:'flex', alignItems:'center', gap:5, background:'rgba(255,255,255,.06)', border:'1px solid rgba(255,255,255,.12)', borderRadius:999, padding:'2px 9px 2px 7px' }}>
      <svg viewBox="0 0 24 24" style={{ width:11, height:11 }}><circle cx="12" cy="12" r="9" fill="none" stroke="#9FB2E6" strokeWidth="2.2"/><path d="M12 8 V12 L15 14" stroke="#9FB2E6" strokeWidth="2.2" fill="none" strokeLinecap="round"/></svg>
      <span style={{ fontSize:10, fontWeight:700, color:'#C6D0E8' }}>{timer}</span>
    </div>
  );
}
function PlantTile({ plant }) {
  if (plant.state === 'empty') return (
    <div style={{ position:'relative', borderRadius:22, overflow:'hidden', background:'rgba(255,255,255,.02)', border:'1px dashed rgba(255,255,255,.18)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:8 }}>
      <div style={{ width:40, height:40, borderRadius:'50%', background:'rgba(167,206,115,.14)', border:'1px solid rgba(167,206,115,.32)', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <svg viewBox="0 0 24 24" style={{ width:20, height:20 }}><path d="M12 6 V18 M6 12 H18" stroke={C.green} strokeWidth="2.2" strokeLinecap="round"/></svg>
      </div>
      <div style={{ fontSize:12, fontWeight:600, color:'#9FAE92' }}>Посадити</div>
    </div>
  );
  const t = TILE[plant.state];
  const desat = plant.state === 'disease' ? 'saturate(.55) brightness(.92)' : 'none';
  return (
    <div style={{ position:'relative', borderRadius:22, overflow:'hidden', background:t.bg, border:`1px solid ${t.border}`, boxShadow:'inset 0 1px 0 rgba(255,255,255,.07)' }}>
      {plant.state === 'ready' && <div style={{ position:'absolute', inset:0, background:'radial-gradient(90% 55% at 50% 120%, rgba(167,206,115,.22), transparent 70%)' }}/>}
      <StateBadge state={plant.state} timer={plant.timer}/>
      <PlantArt w={84} style={{ position:'absolute', bottom:30, left:'50%', transform:'translateX(-50%)', filter:desat }}/>
      <div style={{ position:'absolute', bottom:9, left:12, right:12 }}>
        <div style={{ fontFamily:C.head, fontWeight:600, fontSize:18, color:C.text, lineHeight:1 }}>{plant.name}</div>
        <div style={{ marginTop:5, height:4, borderRadius:999, background:'rgba(255,255,255,.1)', overflow:'hidden' }}><div style={{ height:'100%', width:plant.pct+'%', borderRadius:999, background:t.bar }}/></div>
      </div>
    </div>
  );
}

/* ── НИЖНЯ НАВІГАЦІЯ ───────────────────────────────────── */
const NAV_ICON = {
  garden:<svg viewBox="0 0 24 24" style={{ width:22, height:22 }}><path d="M12 21 V11" stroke="#B5E67A" strokeWidth="2.2" strokeLinecap="round"/><path d="M12 14 Q6 13 5 6 Q12 7 12 14 Z" fill="#A7CE73"/><path d="M12 11 Q18 10 19 4 Q13 5 12 11 Z" fill="#8FB861"/></svg>,
  lab:<svg viewBox="0 0 24 24" style={{ width:23, height:23 }}><path d="M10 3 V10 L5 20 Q4 22 7 22 H17 Q20 22 19 20 L14 10 V3" fill="none" stroke="#8C9683" strokeWidth="2" strokeLinejoin="round"/><path d="M9 3 H15" stroke="#8C9683" strokeWidth="2" strokeLinecap="round"/></svg>,
  dex:<svg viewBox="0 0 24 24" style={{ width:23, height:23 }}><rect x="5" y="4" width="14" height="16" rx="2" fill="none" stroke="#8C9683" strokeWidth="2"/><path d="M12 4 V20" stroke="#8C9683" strokeWidth="2"/><path d="M15 4 V11 L17 9 L19 11 V4" fill="none" stroke="#8C9683" strokeWidth="1.8" strokeLinejoin="round"/></svg>,
  shop:<svg viewBox="0 0 24 24" style={{ width:23, height:23 }}><path d="M4 8 H20 L18.5 19 Q18 21 16 21 H8 Q6 21 5.5 19 Z" fill="none" stroke="#8C9683" strokeWidth="2" strokeLinejoin="round"/><path d="M8.5 8 Q8.5 4 12 4 Q15.5 4 15.5 8" fill="none" stroke="#8C9683" strokeWidth="2"/></svg>,
};
function BottomNav({ items }) {
  return (
    <div style={{ position:'absolute', bottom:14, left:16, right:16, height:86, zIndex:6, borderRadius:26, background:'rgba(13,18,10,.74)', backdropFilter:'blur(18px)', border:`1px solid ${C.border}`, boxShadow:'0 12px 30px -10px rgba(0,0,0,.6)', display:'flex', alignItems:'center', padding:'0 6px' }}>
      {items.map(it => (
        <div key={it.id} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:5 }}>
          <div style={{ width:44, height:38, borderRadius:13, display:'flex', alignItems:'center', justifyContent:'center',
            background: it.active ? 'rgba(167,206,115,.18)' : 'transparent',
            border: it.active ? '1px solid rgba(167,206,115,.34)' : '1px solid transparent' }}>{NAV_ICON[it.id]}</div>
          <span style={{ fontSize:11, fontWeight: it.active ? 700 : 600, color: it.active ? '#CDEBA0' : C.mut, letterSpacing:.2 }}>{it.label}</span>
        </div>
      ))}
    </div>
  );
}

/* ── ЕКРАН ─────────────────────────────────────────────── */
function HomeScreen({ player, plants, nav }) {
  const growing = plants.filter(p => p.state === 'growing' || p.state === 'disease').length;
  const ready = plants.filter(p => p.state === 'ready').length;
  return (
    <div style={{ position:'relative', width:390, height:844, borderRadius:46, overflow:'hidden', boxShadow:'0 40px 80px -30px rgba(0,0,0,.8)', border:'6px solid #23291F' }}>
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(130% 90% at 50% -5%, #22301C 0%, #151D12 46%, #0D120A 100%)' }}/>
      <div style={{ position:'absolute', top:-60, right:-40, width:220, height:220, borderRadius:'50%', background:'radial-gradient(circle,rgba(167,206,115,.18),transparent 70%)' }}/>
      <TopBar player={player}/>
      <div style={{ position:'absolute', top:150, left:20, right:20, zIndex:5 }}><GardenHeading growing={growing} ready={ready}/></div>
      <div style={{ position:'absolute', top:250, left:16, right:16, bottom:118, zIndex:3, display:'grid', gridTemplateColumns:'1fr 1fr', gridTemplateRows:'repeat(3,1fr)', gap:12 }}>
        {plants.map(p => <PlantTile key={p.id} plant={p}/>)}
      </div>
      <BottomNav items={nav}/>
    </div>
  );
}

function App() {
  return (
    <div style={{ minHeight:'100vh', display:'flex', justifyContent:'center', alignItems:'flex-start', padding:'48px 40px 80px' }}>
      <figure style={{ margin:0 }}>
        <figcaption style={{ fontFamily:C.disp, fontSize:20, color:C.text, marginBottom:12 }}>Головний екран «Мій сад»</figcaption>
        <HomeScreen player={PLAYER} plants={PLANTS} nav={NAV}/>
      </figure>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  const __src = document.getElementById('app-src').textContent;
  const __out = Babel.transform(__src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(__out);
</script>
</body>
</html>
